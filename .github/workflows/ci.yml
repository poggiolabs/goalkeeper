name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:39fb82e41109483c81ac15422a302500b4a753777b47f8431038703536bc6c52
        env:
          POSTGRES_DB: goalkeeper
          POSTGRES_USER: goalkeeper
          POSTGRES_PASSWORD: goalkeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goalkeeper -d goalkeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://goalkeeper:goalkeeper@127.0.0.1:5432/goalkeeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run docs:generate
      - name: Verify generated files are current
        run: git diff --exit-code

  web-distribution:
    name: Build web distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Build and verify distribution
        env:
          REVISION: ${{ github.sha }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          bun scripts/web-distribution.ts build "$version" "$REVISION"
      - name: Package and verify distribution
        env:
          REVISION: ${{ github.sha }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          archive="goalkeeper-web-dist-$version.tar.gz"
          source_date_epoch="$(git show -s --format=%ct "$REVISION")"
          mkdir -p artifacts extracted
          tar --sort=name --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -czf "artifacts/$archive" -C apps/web/dist .
          tar -xzf "artifacts/$archive" -C extracted
          bun scripts/web-distribution.ts verify "$version" "$REVISION" extracted
          bun scripts/web-distribution.ts checksum "artifacts/$archive"

  containers:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goalkeeper-api
            dockerfile: containers/api/Dockerfile
          - image: goalkeeper-mcp
            dockerfile: containers/mcp/Dockerfile
          - image: goalkeeper-web
            dockerfile: containers/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: goalkeeper/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
