services:
  postgres:
    image: postgres:17
    container_name: goalkeeper-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: goalkeeper
      POSTGRES_USER: goalkeeper
      POSTGRES_PASSWORD: goalkeeper
    volumes:
      - goalkeeper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalkeeper -d goalkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goalkeeper-postgres:
